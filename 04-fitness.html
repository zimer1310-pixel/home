function works(){open('Наши проекты',`<p class="detail-lead">Примеры направлений работы архитектурного бюро.</p><div class="detail-grid">${D.works.map((w,i)=>`<article class="detail-card"><span class="count">ПРОЕКТ 0${i+1}</span><h3>${esc(w)}</h3><p>Концептуальный проект для демонстрации портфолио.</p></article>`).join('')}</div><div class="detail-actions">${action('Обсудить проект','plans',true)}</div>`)}
function plans(){open(C.section+' · тарифы',`<p class="detail-lead">Выберите подходящий вариант. Все цены указаны для примера.</p><div class="plan-grid">${C.plans.map((p,i)=>`<div class="plan"><h3>${esc(p)}</h3><strong>${esc(C.prices[i])} ₽</strong><small>${esc(D.services[i]?.[1]||'Индивидуальное предложение')}</small><button type="button" data-plan="${i}">Выбрать →</button></div>`).join('')}</div><p class="demo-note">Оплата не подключена. Суммы и предложения вымышлены.</p>`)}
function checkout(i){let p=C.plans[i];open('Заявка · '+p,`<p class="detail-lead">${esc(p)} · <b>${esc(C.prices[i])} ₽</b></p><form class="demo-form" id="demo-order"><div class="two"><label>Ваше имя<input name="name" required placeholder="Александр" maxlength="60" autocomplete="off"></label><label>Телефон<input name="phone" required placeholder="+7 900 000-00-00" maxlength="25" autocomplete="off"></label></div><label>Удобная дата<input name="date" type="date" required></label><label>Способ оплаты<select name="method"><option>Картой онлайн (демо)</option><option>При посещении (демо)</option></select></label><button class="demo-submit" type="submit">Оформить демо-заявку</button><div class="detail-actions">${action('← Вернуться к тарифам','plans')}</div><p class="demo-note">Данные никуда не отправляются, деньги не списываются.</p></form>`);const f=document.getElementById('demo-order');let today=new Date();today.setMinutes(today.getMinutes()-today.getTimezoneOffset());f.elements.date.min=today.toISOString().slice(0,10);f.addEventListener('submit',e=>{e.preventDefault();if(!f.reportValidity())return;let name=f.elements.name.value;open('Демо-заявка готова',`<div class="demo-receipt"><h3>✓ Заявка оформлена на экране</h3><p>${esc(name)}, вы выбрали «${esc(p)}» за ${esc(C.prices[i])} ₽.</p><p>Дата: ${esc(f.elements.date.value)}</p></div><p class="demo-note">Это имитация: заявка не отправлена и платёж не проведён.</p><div class="detail-actions">${action('К тарифам','plans',true)}</div>`)})}
const views={services,about,contact:contacts,plans,works};document.addEventListener('click',e=>{let b=e.target.closest('button[data-view],button[data-plan]');if(!b)return;if(b.hasAttribute('data-plan'))checkout(+b.dataset.plan);else views[b.dataset.view]?.()});document.getElementById('modal-close').addEventListener('click',close);modal.addEventListener('click',e=>{if(e.target===modal)close()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!modal.hidden)close()});
})();</script></body></html>
